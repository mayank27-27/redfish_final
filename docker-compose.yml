services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: redfish
      POSTGRES_PASSWORD: redfish
      POSTGRES_DB: redfishmonitor
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redfish -d redfishmonitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (optional; only needed for multi-worker SocketIO) ────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    profiles:
      - redis   # start with: docker compose --profile redis up

  # ── Redfish Fleet Monitor ──────────────────────────────────────────────────
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"

    # ── Load every variable from backend/.env ─────────────────────────────
    # env_file makes Docker Compose read the file and inject every line as
    # an environment variable into the container. This is the correct way
    # to pass secrets from .env to a container — no need to list each var
    # individually (which caused the ENCRYPTION_KEY to be ignored before).
    env_file:
      - ./backend/.env

    # Override only the values that must differ inside Docker
    # (DATABASE_URL must use the service name "db", not "localhost")
    environment:
      DATABASE_URL: postgresql://redfish:redfish@db:5432/redfishmonitor
      OPENSSL_CONF: /app/openssl_legacy.cnf

    # Mount source so code changes take effect without rebuild
    volumes:
      - ./backend:/app
      # - type: bind
      #   source: '/path/to/tsr'
      #   target: /mnt/tsr
    working_dir: /app

volumes:
  pg_data:
