<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigator Systems — Hardware Monitoring</title>
<meta name="description" content="Production-grade server hardware monitoring platform using Redfish API. Monitor Dell iDRAC, HPE iLO, Lenovo XClarity, and any Redfish-compliant BMC.">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- App CSS -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=16">
</head>
<body>

<div class="app-shell">

  <!-- Top bar -->
  <div class="topbar">
    <div class="brand">
      <img src="{{ url_for('static', filename='logo.png') }}?v=11" alt="Navigator Systems" class="brand-logo">
    </div>
    <div class="topbar-actions">
      <span id="wsStatus" class="pill pill-unknown"><span class="dot"></span> connecting</span>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <nav class="nav-list" id="navList">
      <div class="nav-item" data-view="overview">
        <i class="fa-solid fa-gauge-high"></i>
        <span>Fleet Overview</span>
      </div>
      <div class="nav-item" data-view="nodes">
        <i class="fa-solid fa-server"></i>
        <span>Compute Servers</span>
        <span class="nav-count" id="navNodeCount"></span>
      </div>
      <div class="nav-item" data-view="storage_nodes">
        <i class="fa-solid fa-database"></i>
        <span>Storage Devices</span>
        <span class="nav-count" id="navStorageCount"></span>
      </div>
      <div class="nav-item" data-view="alerts">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>Alerts</span>
        <span class="nav-count nav-count-alert" id="navAlertCount" style="display:none;"></span>
      </div>
      <div class="nav-item" data-view="storage-devices">
        <i class="fa-solid fa-database"></i>
        <span>Storage Devices</span>
        <span class="nav-count" id="navStorageDeviceCount"></span>
      </div>
    </nav>
    <div class="sidebar-brand-footer">
      <span class="pulse-dot"></span> Powered by Navigator Systems
    </div>
  </div>

  <!-- Main content -->
  <div class="main" id="main"></div>

</div>

<!-- Add server modal -->
<div class="modal-overlay" id="addServerModal">
  <div class="modal">
    <h2><i class="fa-solid fa-plus-circle" style="color:var(--accent);margin-right:8px;font-size:16px;"></i>Add Device</h2>
    <div class="field">
      <label>Device Category / Type</label>
      <select id="f_device_type" style="width:100%; background:var(--panel-alt); border:1px solid var(--border); color:var(--text-bright); border-radius:var(--radius-md); padding:8px; outline:none;">
        <option value="server">Server / Compute Node</option>
        <option value="storage">Storage Device / SAN Array (e.g. HPE MSA)</option>
      </select>
    </div>
    <div class="field">
      <label>Hostname / Display name</label>
      <input id="f_hostname" placeholder="msa2040-san-01" autocomplete="off">
    </div>
    <div class="field">
      <label>Management IP address</label>
      <input id="f_ip" placeholder="192.168.2.214" autocomplete="off">
    </div>
    <div class="field">
      <label>Management Username (Optional if using Agent)</label>
      <input id="f_username" placeholder="manage" autocomplete="off">
    </div>
    <div class="field">
      <label>Management Password (Optional if using Agent)</label>
      <input id="f_password" type="password" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Management Protocol</label>
      <select id="f_protocol" style="width:100%; background:var(--panel-alt); border:1px solid var(--border); color:var(--text-bright); border-radius:var(--radius-md); padding:8px; outline:none;">
        <option value="redfish">Redfish API (Standard)</option>
        <option value="ilo2">NaviBypass (Legacy)</option>
      </select>
    </div>
    <div class="field">
      <label>Site ID (Optional)</label>
      <input id="f_site_id" placeholder="site-uuid" autocomplete="off">
    </div>
    <div class="field">
      <label>Agent ID (Optional)</label>
      <input id="f_agent_id" placeholder="agent-uuid" autocomplete="off">
    </div>
    <div class="field-row" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
      <div class="field">
        <label>Customer Name (Optional)</label>
        <input id="f_customer_name" placeholder="Acme Corp" autocomplete="off">
      </div>
      <div class="field">
        <label>Customer Location (Optional)</label>
        <input id="f_customer_location" placeholder="Rack A-12, DC-1" autocomplete="off">
      </div>
    </div>
    <div class="field">
      <label>Maintenance Records (Optional)</label>
      <textarea id="f_maintenance_records" placeholder="Enter maintenance logs or service records..." style="width:100%; height:70px; background:var(--panel-alt); border:1px solid var(--border); color:var(--text-bright); border-radius:var(--radius-md); padding:8px; outline:none; font-family:inherit; resize:vertical;"></textarea>
    </div>
    <div class="field">
      <label>Polling interval (seconds)</label>
      <input id="f_interval" value="30" type="number" min="10" max="3600">
    </div>
    <div class="modal-error" id="addServerError" style="display:none;"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelAddServer">Cancel</button>
      <button class="btn-primary" id="submitAddServer"><i class="fa-solid fa-server"></i> Add server</button>
    </div>
  </div>
</div>

<!-- Edit server modal -->
<div class="modal-overlay" id="editServerModal">
  <div class="modal">
    <h2><i class="fa-solid fa-pen-to-square" style="color:var(--accent);margin-right:8px;font-size:16px;"></i>Edit Server</h2>
    <div class="field">
      <label>Display name</label>
      <input id="e_display_name" placeholder="my-server" autocomplete="off">
    </div>
    <div class="field">
      <label>BMC Username</label>
      <input id="e_username" placeholder="root" autocomplete="off">
    </div>
    <div class="field">
      <label>New BMC Password <span style="color:var(--text-faint);font-size:10px;">(leave blank to keep current)</span></label>
      <input id="e_password" type="password" autocomplete="new-password" placeholder="••••••••">
    </div>
    <div class="field">
      <label>Device Category / Type</label>
      <select id="e_device_type" style="width:100%; background:var(--panel-alt); border:1px solid var(--border); color:var(--text-bright); border-radius:var(--radius-md); padding:8px; outline:none;">
        <option value="server">Server / Compute Node</option>
        <option value="storage">Storage Device / SAN Array</option>
      </select>
    </div>
    <div class="field">
      <label>Management Protocol</label>
      <select id="e_protocol" style="width:100%; background:var(--panel-alt); border:1px solid var(--border); color:var(--text-bright); border-radius:var(--radius-md); padding:8px; outline:none;">
        <option value="redfish">Redfish API (Standard)</option>
        <option value="ilo2">NaviBypass (Legacy)</option>
      </select>
    </div>
    <div class="field">
      <label>Site ID (Optional)</label>
      <input id="e_site_id" placeholder="site-uuid" autocomplete="off">
    </div>
    <div class="field">
      <label>Agent ID (Optional)</label>
      <input id="e_agent_id" placeholder="agent-uuid" autocomplete="off">
    </div>
    <div class="field-row" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
      <div class="field">
        <label>Customer Name (Optional)</label>
        <input id="e_customer_name" placeholder="Acme Corp" autocomplete="off">
      </div>
      <div class="field">
        <label>Customer Location (Optional)</label>
        <input id="e_customer_location" placeholder="Rack A-12, DC-1" autocomplete="off">
      </div>
    </div>
    <div class="field">
      <label>Maintenance Records (Optional)</label>
      <textarea id="e_maintenance_records" placeholder="Enter maintenance logs or service records..." style="width:100%; height:70px; background:var(--panel-alt); border:1px solid var(--border); color:var(--text-bright); border-radius:var(--radius-md); padding:8px; outline:none; font-family:inherit; resize:vertical;"></textarea>
    </div>
    <div class="field">
      <label>Polling interval (seconds)</label>
      <input id="e_interval" type="number" min="10" max="3600" value="30">
    </div>
    <div class="modal-error" id="editServerError" style="display:none;"></div>
    <div class="modal-actions" style="justify-content:space-between;">
      <button class="btn-secondary btn-danger" id="deleteServerBtn"><i class="fa-solid fa-trash"></i> Delete</button>
      <div style="display:flex;gap:10px;">
        <button class="btn-secondary" id="cancelEditServer">Cancel</button>
        <button class="btn-primary" id="submitEditServer"><i class="fa-solid fa-floppy-disk"></i> Save</button>
      </div>
    </div>
  </div>
</div>


<!-- Category detail popup (opened by clicking a category card - own scroll, doesn't affect grid layout) -->
<div class="modal-overlay" id="categoryModalOverlay">
  <div class="modal detail-modal">
    <div class="detail-modal-header">
      <div class="detail-modal-title">
        <i class="fa-solid" id="categoryModalIcon"></i>
        <span id="categoryModalTitle"></span>
        <span class="count" id="categoryModalCount"></span>
      </div>
      <button class="icon-btn" id="categoryModalClose"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="detail-modal-body" id="categoryModalBody"></div>
  </div>
</div>

<!-- Toast notifications -->
<div class="toast-container" id="toastContainer"></div>

<!-- JS libs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<!-- App -->
<script src="{{ url_for('static', filename='js/app.js') }}?v=16"></script>
</body>
</html>
