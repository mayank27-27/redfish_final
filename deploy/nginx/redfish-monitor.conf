# Redfish Fleet Monitor — Nginx Reverse Proxy
# Install: sudo cp redfish-monitor.conf /etc/nginx/sites-available/
#          sudo ln -s /etc/nginx/sites-available/redfish-monitor.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# For Let's Encrypt TLS:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d monitor.company.com

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name monitor.company.com;  # REPLACE with actual company domain

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitor.company.com;  # REPLACE with actual company domain

    # TLS certificates — managed by Certbot / Let's Encrypt
    # After running certbot, these paths will be auto-populated:
    ssl_certificate     /etc/letsencrypt/live/monitor.company.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.company.com/privkey.pem;

    # Or use company-provided certificates:
    # ssl_certificate     /etc/ssl/certs/company.crt;
    # ssl_certificate_key /etc/ssl/private/company.key;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Request size limits
    client_max_body_size 50M;  # for large telemetry payloads / support bundles

    # Flask application proxy
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running API calls (diagnostics, support bundles)
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    # WebSocket support (Socket.IO)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeout (keep connections alive)
        proxy_read_timeout 86400s;
    }
}
